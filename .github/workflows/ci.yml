on:
  pull_request:
  push:
jobs:
  test:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        sbt:
          - 2.1.0-M3
          - 2.1.0-RC1
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: temurin
    - uses: sbt/setup-sbt@v1
    - run: echo "sbt.version=${{ matrix.sbt }}" > project/build.properties
    - name: default
      run: sbt -v compile
    - name: bash
      shell: bash
      run: sbt -v compile
